name: Build and test UE4TextExtractor

on:
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Verify required ICU dependencies
        shell: pwsh
        run: |
          $required = @(
            "include/unicode/uchar.h",
            "lib/icuuc.lib",
            "lib/icudt.lib"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing required repository dependencies: " + ($missing -join ", "))
          }

      - name: Build Release x64
        shell: pwsh
        run: |
          # The project pins an older SDK not installed on current hosted runners.
          # Override it with the Windows 11 SDK shipped on the Windows Server 2025 image.
          msbuild UE4TextExtractor.vcxproj /m /nologo /v:minimal /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test command-line behavior
        shell: pwsh
        run: |
          $exe = "x64/Release/UE4TextExtractor.exe"
          if (-not (Test-Path $exe)) {
            $exe = "Release/UE4TextExtractor.exe"
          }
          if (-not (Test-Path $exe)) {
            throw "Build succeeded but the expected executable was not found."
          }

          # No arguments must display usage and return a non-zero exit code.
          & $exe *> $null
          $noArgsExitCode = $LASTEXITCODE
          if ($noArgsExitCode -eq 0) {
            throw "Expected usage invocation without arguments to return non-zero."
          }

          # Conflicting output formats must be rejected before touching files.
          & $exe "unused.txt" "unused.locres" -old -v3 *> $null
          $conflictExitCode = $LASTEXITCODE
          if ($conflictExitCode -eq 0) {
            throw "Expected -old and -v3 together to be rejected."
          }

          # Exercise real TXT -> LOCRES conversions, including a common UTF-8 BOM.
          $fixture = @"
=>{TestNamespace}

=>[TestKey][123456]
Hello from the fixture

=>{[END]}
"@
          [System.IO.File]::WriteAllText("fixture.txt", $fixture, [System.Text.UTF8Encoding]::new($true))

          & $exe "fixture.txt" "fixture-v1.locres"
          $v1ExitCode = $LASTEXITCODE
          if ($v1ExitCode -ne 0 -or -not (Test-Path "fixture-v1.locres")) {
            throw "TXT -> version 1 LOCRES conversion failed (exit $v1ExitCode)."
          }
          $v1Bytes = [System.IO.File]::ReadAllBytes("fixture-v1.locres")
          if ($v1Bytes.Length -lt 18 -or $v1Bytes[16] -ne 1) {
            throw "Version 1 output has an invalid header."
          }

          & $exe "fixture.txt" "fixture-v3.locres" -v3
          $v3ExitCode = $LASTEXITCODE
          if ($v3ExitCode -ne 0 -or -not (Test-Path "fixture-v3.locres")) {
            throw "TXT -> version 3 LOCRES conversion failed (exit $v3ExitCode)."
          }
          $v3Bytes = [System.IO.File]::ReadAllBytes("fixture-v3.locres")
          if ($v3Bytes.Length -lt 22 -or $v3Bytes[16] -ne 3) {
            throw "Version 3 output has an invalid header."
          }

          Write-Host "CLI smoke tests and TXT -> LOCRES conversions passed."
          exit 0

      - name: Stage executable artifact
        if: success()
        shell: pwsh
        run: |
          $exe = "x64/Release/UE4TextExtractor.exe"
          if (-not (Test-Path $exe)) {
            $exe = "Release/UE4TextExtractor.exe"
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $exe "artifact/UE4TextExtractor.exe"
          Copy-Item "README.md" "artifact/README.md"

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UE4TextExtractor-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
